name: build

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖
        run: brew install cmake ninja pkg-config qtbase ffmpeg taglib
      - name: 配置
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qtbase)"
      - name: 编译
        run: cmake --build build
      - name: 自测
        run: ./build/echo-selftest

  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config qt6-base-dev \
            libavformat-dev libavcodec-dev libswresample-dev libavutil-dev \
            libtag1-dev libpipewire-0.3-dev libasound2-dev ffmpeg
      - name: 配置
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: 编译
        run: cmake --build build
      - name: 自测
        run: ./build/echo-selftest

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-taglib
      - uses: actions/checkout@v4
      - name: 配置
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: 编译
        run: cmake --build build
      - name: 自测
        run: ./build/echo-selftest.exe
